<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | EV Charge</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- ICONS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background:
                linear-gradient(
                    135deg,
                    #081120,
                    #0f172a,
                    #111827
                );
            position:relative;
        }

        /* ================= BACKGROUND ================= */

        .bg-circle{

            position:absolute;

            border-radius:50%;

            filter:blur(90px);

            opacity:0.45;

            animation:float 8s infinite ease-in-out;
        }

        .circle1{

            width:320px;
            height:320px;

            background:#16a34a;

            top:-100px;
            left:-100px;
        }

        .circle2{

            width:380px;
            height:380px;

            background:#2563eb;

            bottom:-120px;
            right:-120px;

            animation-delay:2s;
        }

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(25px);
            }

            100%{
                transform:translateY(0px);
            }
        }

        /* ================= REGISTER CARD ================= */

        .register-card{

            width:450px;

            padding:45px;

            border-radius:30px;

            background:rgba(15,23,42,0.72);

            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,0.08);

            box-shadow:0 15px 50px rgba(0,0,0,0.45);

            position:relative;

            z-index:10;

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* ================= LOGO ================= */

        .logo{

            text-align:center;

            margin-bottom:35px;
        }

        .logo h1{

            font-size:42px;

            color:white;

            margin-bottom:8px;
        }

        .logo span{
            color:#4ade80;
        }

        .logo p{

            color:#94a3b8;

            font-size:15px;
        }

        /* ================= INPUT BOX ================= */

        .input-box{

            position:relative;

            margin-bottom:22px;
        }

        .input-box i{

            position:absolute;

            left:18px;
            top:18px;

            color:#4ade80;

            font-size:15px;
        }

        .input-box input{

            width:100%;

            padding:16px 16px 16px 50px;

            border:none;

            outline:none;

            border-radius:16px;

            background:#111827;

            color:white;

            font-size:15px;

            transition:0.3s;
        }

        .input-box input:focus{

            box-shadow:0 0 0 3px rgba(34,197,94,0.25);
        }

        /* ================= BUTTON ================= */

        .register-btn{

            width:100%;

            padding:16px;

            border:none;

            border-radius:16px;

            background:
                linear-gradient(
                    90deg,
                    #16a34a,
                    #4ade80
                );

            color:white;

            font-size:16px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;

            margin-top:10px;
        }

        .register-btn:hover{

            transform:translateY(-3px);

            box-shadow:0 10px 25px rgba(34,197,94,0.35);
        }

        /* ================= FOOTER ================= */

        .footer{

            margin-top:25px;

            text-align:center;

            color:#94a3b8;

            font-size:14px;
        }

        .footer a{

            color:#4ade80;

            text-decoration:none;

            font-weight:600;
        }

        .footer a:hover{

            text-decoration:underline;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:500px){

            .register-card{

                width:92%;
                padding:30px;
            }

            .logo h1{

                font-size:32px;
            }
        }

    </style>

</head>

<body>

<!-- ================= BACKGROUND ================= -->

<div class="bg-circle circle1"></div>

<div class="bg-circle circle2"></div>

<!-- ================= REGISTER CARD ================= -->

<div class="register-card">

    <!-- LOGO -->

    <div class="logo">

        <h1>
            ⚡ EV <span>Charge</span>
        </h1>

        <p>
            Create your smart charging account
        </p>

    </div>

    <!-- FORM -->

    <form method="POST">

        <!-- USERNAME -->

        <div class="input-box">

            <i class="fa-solid fa-user"></i>

            <input type="text"
                   name="username"
                   placeholder="Enter username"
                   required>

        </div>

        <!-- EMAIL -->

        <div class="input-box">

            <i class="fa-solid fa-envelope"></i>

            <input type="email"
                   name="email"
                   placeholder="Enter email"
                   required>

        </div>

        <!-- PASSWORD -->

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input type="password"
                   name="password"
                   placeholder="Create password"
                   required>

        </div>

        <!-- BUTTON -->

        <button type="submit"
                class="register-btn">

            Create Account

        </button>

    </form>

    <!-- FOOTER -->

    <div class="footer">

        Already have an account?

        <a href="/login">

            Login Here

        </a>

    </div>

</div>

</body>
</html>
